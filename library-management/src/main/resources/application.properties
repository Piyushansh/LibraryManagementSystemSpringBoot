# ================================================
# Library Management System - Application Config
# ================================================

# --- Server Port ---
server.port=8080

# --- MySQL Database Configuration ---
# Change username and password to match your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Piyush@1234#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Configuration ---
# "update" will auto-create/update tables from entities (good for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf Configuration ---
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- Application Name ---
spring.application.name=Library Management System

# --- Logging Level (optional - helps debug) ---
logging.level.com.librarymanagement=DEBUG
