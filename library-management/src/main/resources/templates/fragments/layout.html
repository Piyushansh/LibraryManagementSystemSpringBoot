<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Library Management'">Library Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<!-- ============================================
     NAVBAR FRAGMENT
     Used on every page with th:replace="fragments/layout :: navbar"
     ============================================ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg main-navbar">
    <div class="container">
        <!-- Brand / Logo -->
        <a class="navbar-brand text-white" th:href="@{/dashboard}">
            <i class="bi bi-book-half me-2"></i>LibraryMS
        </a>

        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/books}">
                        <i class="bi bi-book"></i> Books
                    </a>
                </li>
                <!-- Admin-only links -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/books/add}">
                        <i class="bi bi-plus-circle"></i> Add Book
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/issues}">
                        <i class="bi bi-arrow-left-right"></i> Issue/Return
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
                <!-- User-only links -->
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link" th:href="@{/issues/my}">
                        <i class="bi bi-journal-bookmark"></i> My Books
                    </a>
                </li>
            </ul>

            <!-- Right side: logged-in user + logout -->
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-3">
                    <span class="text-white-50 small">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                        <span class="badge bg-warning text-dark ms-1" sec:authorize="hasRole('ADMIN')">Admin</span>
                        <span class="badge bg-info text-dark ms-1" sec:authorize="hasRole('USER')">User</span>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============================================
     FOOTER FRAGMENT
     ============================================ -->
<footer th:fragment="footer" class="main-footer">
    <p class="mb-0">&copy; 2024 Library Management System &mdash; Built with Spring Boot</p>
</footer>

<!-- ============================================
     SCRIPTS FRAGMENT (include at bottom of pages)
     ============================================ -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
