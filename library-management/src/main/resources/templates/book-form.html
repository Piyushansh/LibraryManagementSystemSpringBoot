<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book Form')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page-wrapper">
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-7">

    <!-- Page Header -->
    <div class="page-header">
        <h2>
            <i class="bi bi-book me-2"></i>
            <!-- If editMode = true → "Edit Book", else "Add New Book" -->
            <span th:text="${editMode} ? 'Edit Book' : 'Add New Book'">Book Form</span>
        </h2>
        <p class="text-muted mb-0" th:text="${editMode} ? 'Update book details below' : 'Fill in the details to add a new book'">Subtitle</p>
    </div>

    <!-- Back Button -->
    <a th:href="@{/books}" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-2"></i>Back to Books
    </a>

    <div class="card">
        <div class="card-body p-4">

            <!-- BOOK FORM -->
            <!-- If editMode: POST to /books/edit/{id}, else POST to /books/add -->
            <form th:action="${editMode} ? @{/books/edit/{id}(id=${book.id})} : @{/books/add}"
                  th:object="${book}"
                  method="post"
                  novalidate>

                <!-- CSRF Token (required by Spring Security) -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="row g-3">

                    <!-- Book Title -->
                    <div class="col-12">
                        <label class="form-label">
                            <i class="bi bi-book me-1"></i>Book Title <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               th:field="*{title}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                               placeholder="e.g. Clean Code">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}">Error</div>
                    </div>

                    <!-- Author -->
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-person me-1"></i>Author <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               th:field="*{author}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'"
                               placeholder="e.g. Robert C. Martin">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('author')}"
                             th:errors="*{author}">Error</div>
                    </div>

                    <!-- Category -->
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-tag me-1"></i>Category
                        </label>
                        <select th:field="*{category}" class="form-select">
                            <option value="">-- Select Category --</option>
                            <option value="Technology">Technology</option>
                            <option value="Science">Science</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Fiction">Fiction</option>
                            <option value="Non-Fiction">Non-Fiction</option>
                            <option value="History">History</option>
                            <option value="Biography">Biography</option>
                            <option value="Business">Business</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Quantity -->
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-stack me-1"></i>Total Quantity <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               th:field="*{quantity}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                               min="1"
                               placeholder="e.g. 5">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}"
                             th:errors="*{quantity}">Error</div>
                        <small class="form-text text-muted">
                            Total number of copies owned by the library
                        </small>
                    </div>

                    <!-- Info box for edit mode -->
                    <div class="col-12" th:if="${editMode}">
                        <div class="alert alert-info mb-0">
                            <i class="bi bi-info-circle me-2"></i>
                            Currently available copies:
                            <strong th:text="${book.availableQuantity}">0</strong>
                            / <span th:text="${book.quantity}">0</span>
                            &nbsp;&nbsp;|&nbsp;&nbsp;
                            Currently issued:
                            <strong th:text="${book.quantity - book.availableQuantity}">0</strong>
                        </div>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="col-12 d-flex gap-2 pt-2">
                        <button type="submit" class="btn btn-primary flex-fill">
                            <i class="bi bi-check-circle me-2"></i>
                            <span th:text="${editMode} ? 'Update Book' : 'Add Book'">Submit</span>
                        </button>
                        <a th:href="@{/books}" class="btn btn-outline-secondary flex-fill">
                            <i class="bi bi-x-circle me-2"></i>Cancel
                        </a>
                    </div>

                </div>
            </form>
        </div>
    </div>

</div>
</div>
</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
