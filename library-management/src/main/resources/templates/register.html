<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width:500px">

        <div class="auth-logo">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join the Library Management System</p>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Error</span>
        </div>

        <!-- REGISTRATION FORM -->
        <!-- th:action → Thymeleaf generates correct URL -->
        <!-- th:object → binds form to UserDTO object     -->
        <form th:action="@{/register}" th:object="${userDTO}" method="post" novalidate>

            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">
                    <i class="bi bi-person me-1"></i>Full Name
                </label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                       placeholder="John Doe"
                       required autofocus>
                <!-- Show validation error below field -->
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">Name error</div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope me-1"></i>Email Address
                </label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                       placeholder="you@example.com"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">Email error</div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="bi bi-lock me-1"></i>Password
                </label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                       placeholder="Minimum 6 characters"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">Password error</div>
            </div>

            <!-- Role Selection -->
            <div class="mb-4">
                <label for="role" class="form-label">
                    <i class="bi bi-shield me-1"></i>Register As
                </label>
                <select id="role" th:field="*{role}" class="form-select">
                    <option value="ROLE_USER">User (Borrow Books)</option>
                    <option value="ROLE_ADMIN">Admin (Manage Library)</option>
                </select>
            </div>

            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- Submit -->
            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <i class="bi bi-person-check me-2"></i>Create Account
            </button>

            <p class="text-center text-muted mb-0">
                Already have an account?
                <a th:href="@{/login}" class="fw-bold" style="color:var(--primary-light);">
                    Sign In
                </a>
            </p>

        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
