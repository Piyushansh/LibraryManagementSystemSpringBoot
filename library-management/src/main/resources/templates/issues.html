<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Issue & Return')}" ></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page-wrapper">
<div class="container">

    <!-- Page Header -->
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h2><i class="bi bi-arrow-left-right me-2"></i>Issue &amp; Return</h2>
            <p class="text-muted mb-0">
                <span th:text="${pageTitle != null} ? ${pageTitle} : 'All book transactions'">Subtitle</span>
                &mdash; <strong th:text="${currentlyOut}">0</strong> currently issued
            </p>
        </div>
        <a th:href="@{/issues/new}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-book-fill me-2"></i>Issue a Book
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Issued Books Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>User</th>
                            <th>Book Title</th>
                            <th>Issue Date</th>
                            <th>Due Date</th>
                            <th>Return Date</th>
                            <th>Fine (₹)</th>
                            <th>Status</th>
                            <th sec:authorize="hasRole('ADMIN')">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="issue, iterStat : ${issuedBooks}">
                            <td data-label="#" th:text="${iterStat.count}">1</td>
                            <td data-label="User">
                                <div class="fw-semibold" th:text="${issue.user.name}">Name</div>
                                <small class="text-muted" th:text="${issue.user.email}">email</small>
                            </td>
                            <td data-label="Book">
                                <div th:text="${issue.book.title}">Title</div>
                                <small class="text-muted" th:text="${issue.book.author}">Author</small>
                            </td>
                            <td data-label="Issue Date" th:text="${issue.issueDate}">Date</td>
                            <td data-label="Due Date">
                                <!-- Highlight overdue in red -->
                                <span th:text="${issue.dueDate}"
                                      th:classappend="${issue.status == 'ISSUED' and #temporals.createNow().toLocalDate().isAfter(issue.dueDate)} ? 'text-danger fw-bold' : ''">
                                    Due
                                </span>
                                <span class="badge bg-danger ms-1"
                                      th:if="${issue.status == 'ISSUED' and #temporals.createNow().toLocalDate().isAfter(issue.dueDate)}">
                                    Overdue
                                </span>
                            </td>
                            <td data-label="Return Date"
                                th:text="${issue.returnDate != null} ? ${issue.returnDate} : '—'">—</td>
                            <td data-label="Fine">
                                <span th:text="${issue.fine > 0} ? '₹' + ${issue.fine} : '—'"
                                      th:classappend="${issue.fine > 0} ? 'text-danger fw-bold'">
                                    —
                                </span>
                            </td>
                            <td data-label="Status">
                                <span class="badge"
                                      th:classappend="${issue.status == 'ISSUED'} ? 'badge-issued' : 'badge-returned'"
                                      th:text="${issue.status}">
                                    Status
                                </span>
                            </td>
                            <!-- Return button (Admin, only if not already returned) -->
                            <td data-label="Action" sec:authorize="hasRole('ADMIN')">
                                <a th:if="${issue.status == 'ISSUED'}"
                                   th:href="@{/issues/return/{id}(id=${issue.id})}"
                                   class="btn btn-sm btn-warning"
                                   onclick="return confirm('Mark this book as returned?')">
                                    <i class="bi bi-arrow-return-left me-1"></i>Return
                                </a>
                                <span th:if="${issue.status == 'RETURNED'}"
                                      class="text-muted small">Returned</span>
                            </td>
                        </tr>

                        <!-- No records -->
                        <tr th:if="${#lists.isEmpty(issuedBooks)}">
                            <td colspan="9" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                No issued books found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
