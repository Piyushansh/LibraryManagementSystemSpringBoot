<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page-wrapper d-flex align-items-center justify-content-center">
<div class="container">
<div class="row justify-content-center">
<div class="col-md-6">
    <div class="card text-center">
        <div class="card-body py-5">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:4rem;"></i>
            <h2 class="mt-3 text-danger" th:text="${errorType}">Error</h2>
            <p class="text-muted" th:text="${errorMessage}">Something went wrong.</p>
            <a th:href="@{/dashboard}" class="btn btn-primary mt-2">
                <i class="bi bi-house me-2"></i>Go to Dashboard
            </a>
        </div>
    </div>
</div>
</div>
</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
